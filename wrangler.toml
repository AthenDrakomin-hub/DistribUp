name = "distribup"
main = "src/workers/index.ts"
compatibility_date = "2024-06-05"
compatibility_flags = ["nodejs_compat"]

# Workers runtime variables (plaintext, safe to commit).
# Secrets (JWT_SECRET) must be set via `wrangler secret put JWT_SECRET`, NOT here.
[vars]
BASE_URL = "https://distribup.your-domain.workers.dev"
NODE_ENV = "production"
MAX_UPLOAD_SIZE = "524288000"
# Public R2 URL (bind a custom domain to your R2 bucket, e.g. dl.yourdomain.com)
R2_PUBLIC_BASE = "https://dl.yourdomain.com"

# App Store Connect API (optional, for automatic iOS device registration)
ASC_ISSUER_ID = ""
ASC_KEY_ID = ""
ASC_PRIVATE_KEY = ""

# VPS sign sidecar (zsign on your Vultr box). SIGNSERVER_SECRET must be set via:
#   wrangler secret put SIGNSERVER_SECRET
SIGNSERVER_URL = "http://45.77.31.155:3001"

# Static HTML is inlined into the Worker as base64 (see scripts/embed-html.cjs).
# assets = { directory = "public" }

# D1 binding — create your own with: wrangler d1 create distribup-db
[[d1_databases]]
binding = "distribup_db"
database_name = "distribup-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# R2 bucket — create your own with: wrangler r2 bucket create distribup-files
[[r2_buckets]]
binding = "STORAGE"
bucket_name = "distribup-files"

[observability]
enabled = true
head_sampling_rate = 1
