<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DistribUp - App Distribution</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f7; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 60px 20px; text-align: center; }
        .header h1 { font-size: 48px; margin-bottom: 12px; }
        .header p { font-size: 18px; opacity: 0.9; }
        .main { max-width: 800px; margin: 40px auto; padding: 0 20px; text-align: center; }
        .btn { display: inline-block; padding: 14px 40px; background: #667eea; color: white; border-radius: 8px; text-decoration: none; font-size: 16px; font-weight: 600; margin-top: 24px; }
        .btn:hover { background: #5568d3; }
        footer { background: #1a1a2e; color: #888; padding: 24px; text-align: center; margin-top: 80px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>📦 DistribUp</h1>
        <p>Private iOS/Android app distribution</p>
        <a class="btn" href="/login.html">Sign In</a>
    </div>
    <div class="main">
        <p style="color:#666;line-height:1.7">
            This is a private distribution instance.
            Access is by invitation only — ask the administrator for an account.
        </p>
    </div>
    <footer>&copy; 2026 DistribUp</footer>

</html>
