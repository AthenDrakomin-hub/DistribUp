version: '3.8'

services:
  distribup:
    build: .
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - NODE_ENV=production
      - DB_PATH=/data/distribup.db
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - API_SECRET=${API_SECRET}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-500MB}
    volumes:
      - ./data:/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
